name: Build Nam KNoB

# Builds Nam KNoB (formerly VFXAamps) and its installers.
# Every push produces downloadable installers (workflow artifacts);
# pushing a version tag (v1.0.0, v1.2.3, ...) also attaches them to a GitHub Release.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vfxaamps-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  BUILD_TYPE: Release

jobs:
  dsp-tests:
    name: DSP tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVFXA_BUILD_PLUGIN=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Morph / resampler / tone tests
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS (universal) installer
    # Intel runner: arm64 macOS runners have not been getting assigned for this repo; the build is universal either way.
    runs-on: macos-15-intel
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_APP_SIGN_ID: ${{ secrets.MACOS_APP_SIGN_ID }}
      MACOS_PKG_SIGN_ID: ${{ secrets.MACOS_PKG_SIGN_ID }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}";
          else v="$(sed -n 's/^project(VFXAampsHead VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=${v%%-*}" >> "$GITHUB_OUTPUT"

      - name: Install Ninja
        run: brew install ninja

      - name: Configure (arm64 + x86_64)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel

      - name: Tests (DSP + plugin, incl. UI snapshot)
        run: |
          ctest --test-dir build --output-on-failure -R dsp_tests
          mkdir -p screenshots
          "$(find build -name VFXAampsPluginTests -type f -perm -u+x | head -1)" "$PWD/screenshots"

      - name: Check universal binaries
        run: |
          lipo -info build/source/VFXAamps_artefacts/Release/"VST3/Nam KNoB.vst3/Contents/MacOS/Nam KNoB"
          lipo -info build/source/VFXAamps_artefacts/Release/"AU/Nam KNoB.component/Contents/MacOS/Nam KNoB"
          lipo -info build/source/VFXAamps_artefacts/Release/"Standalone/Nam KNoB.app/Contents/MacOS/Nam KNoB"

      - name: Import signing certificates (only if secrets are set)
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build DMG (+ .pkg for VST3/AU; signed/notarised when secrets exist)
        run: installer/mac/make_installer.sh build/source/VFXAamps_artefacts/Release dist "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: NamKNoB-macOS-installer
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NamKNoB-UI-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore

  windows:
    name: Windows x64 installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}";
          else v="$(sed -n 's/^project(VFXAampsHead VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=${v%%-*}" >> "$GITHUB_OUTPUT"

      - name: Configure (x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Inno Setup installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} /DNumVersion=${{ steps.ver.outputs.numeric }} "/DArtefacts=$PWD\build\source\VFXAamps_artefacts\Release" "/DOutputDir=$PWD\dist" installer\windows\VFXAamps.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: NamKNoB-Windows-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Attach installers to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dsp-tests, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NamKNoB-*-installer
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
